<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <filter id="glow-cyan"><feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.9"/></filter>
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="16" ry="3.5" fill="rgba(0,0,0,0.25)"/>
  <!-- Shoulder Armor -->
  <rect x="11" y="29" width="10" height="10" rx="3" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="43" y="29" width="10" height="10" rx="3" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Body Armor -->
  <rect x="19" y="28" width="26" height="22" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <!-- Chest Reactor (Glowing) -->
  <circle cx="32" cy="37" r="5" fill="#06b6d4" filter="url(#glow-cyan)"/>
  <circle cx="32" cy="37" r="2.5" fill="#ffffff"/>
  <!-- Legs -->
  <rect x="23" y="49" width="7" height="10" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="34" y="49" width="7" height="10" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Mecha Head -->
  <rect x="20" y="10" width="24" height="18" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <!-- Ear Antennas -->
  <line x1="19" y1="16" x2="15" y2="12" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="16" x2="49" y2="12" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <!-- Cyber Visor -->
  <polygon points="24,17 40,17 38,23 26,23" fill="#06b6d4" filter="url(#glow-cyan)"/>
  <line x1="27" y1="20" x2="37" y2="20" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
</svg>